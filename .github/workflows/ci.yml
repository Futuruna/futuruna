name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Build (debug)
        run: cargo build

      - name: Unit tests (lib)
        run: cargo test --lib

      - name: Unit tests (runa binary)
        run: cargo test --bin runa

      - name: Build (release)
        run: cargo build --release

      - name: Runa tests (interpreter)
        run: ./target/release/runa test

      - name: Runa tests (compiled)
        run: ./target/release/runa test --run
        continue-on-error: true  # Some tests need external deps; tracked separately

      - name: Codegen validation
        run: ./target/release/runa test --check-codegen
        continue-on-error: true  # 15 known failures, tracking progress

      - name: Format check
        run: ./target/release/runa fmt --check tests/

      - name: Version
        run: ./target/release/runa --version

  fmt:
    name: Rust formatting
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --check
