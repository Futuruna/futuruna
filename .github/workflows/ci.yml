name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  editor-grammar:
    name: Editor grammar
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: editors/vscode/package-lock.json
      - run: npm ci --ignore-scripts
        working-directory: editors/vscode
      - run: npm test
        working-directory: editors/vscode

  repository-hygiene:
    name: Repository hygiene
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m unittest discover -s scripts/tests -p 'test_repository_hygiene.py'
      - run: python3 scripts/repository-hygiene.py

  # scripts/mint.sh and scripts/tax-audit-safeguards.sh define the steps; each
  # shard runs some of their groups with --keep-going, so a run reports every
  # failing command instead of the first. Together the shards run every step
  # on both platforms. Shards are balanced by measured step durations (see
  # docs/mint-gate.md). The safeguards follow cargo test, as in the former
  # single job, so they find the calculation contract cache its model fixtures
  # fill; a cold personskat schema can exceed a safeguard's 180 s limit.
  test:
    name: Test (${{ matrix.os }}, ${{ matrix.shard }})
    runs-on: ${{ matrix.os }}
    strategy:
      # Preserve every platform and shard result when one fails.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        shard: [rust, interpreter, codegen, roundtrip]
        include:
          - shard: rust
            groups: --group rust
            safeguards: true
          - shard: interpreter
            groups: --group interpreter --group checks
          - shard: codegen
            groups: --group codegen
          - shard: roundtrip
            groups: --group roundtrip

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Install Z3 for solver verification
        if: runner.os == 'Linux'
        env:
          Z3_VERSION: 4.13.3
          Z3_SHA256: 32c7377026733c9d7b33c21cd77a68f50ba682367207b031a6bfd80140a8722f
        run: |
          curl -fsSL --retry 5 -o "$RUNNER_TEMP/z3.zip" "https://github.com/Z3Prover/z3/releases/download/z3-${Z3_VERSION}/z3-${Z3_VERSION}-x64-glibc-2.35.zip"
          echo "${Z3_SHA256}  $RUNNER_TEMP/z3.zip" | sha256sum --check --strict
          unzip -q "$RUNNER_TEMP/z3.zip" -d "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/z3-${Z3_VERSION}-x64-glibc-2.35/bin" >> "$GITHUB_PATH"

      # Every later step needs this binary; mint's own build is then a no-op.
      - name: Build release binary
        id: build
        run: cargo build --release

      - name: Mint gate (${{ matrix.groups }})
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: ./scripts/mint.sh --keep-going ${{ matrix.groups }}

      - name: Tax-audit runtime and setup safeguards
        if: ${{ matrix.safeguards && !cancelled() && steps.build.outcome == 'success' }}
        run: ./scripts/tax-audit-safeguards.sh --keep-going

      - name: From-rust transpiler validation
        if: ${{ matrix.safeguards && !cancelled() && steps.build.outcome == 'success' }}
        run: ./target/release/runa from-rust --test examples/from-rust/

      # tests/formatter_preservation.rs checks formatting across tests/ in
      # mint's cargo test lane, including expected syntax-error rejections.

      - name: Version
        if: ${{ matrix.safeguards && !cancelled() && steps.build.outcome == 'success' }}
        run: ./target/release/runa --version

  fmt:
    name: Rust formatting
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --check

  website:
    name: Website SSG
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust and WebAssembly target
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
          targets: wasm32-unknown-unknown

      - name: Cache website build tools
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            website/target/
          key: ${{ runner.os }}-website-dx-0.7.10-${{ hashFiles('Cargo.lock', 'website/Cargo.lock') }}

      - name: Install Dioxus CLI
        run: |
          if ! dx --version 2>/dev/null | grep -Fq 'dioxus 0.7.10 '; then
            cargo install dioxus-cli --version 0.7.10 --locked --force
          fi

      - name: Check website formatting
        run: cargo fmt --manifest-path website/Cargo.toml --check

      - name: Test canonical host redirect
        run: node --test website/cloudflare/www-redirect/worker.test.mjs

      - name: Build and verify static website
        run: ./website/scripts/build-ssg.sh

      - name: Upload generated website
        uses: actions/upload-artifact@v4
        with:
          name: futuruna-website
          path: website/target/dx/futuruna-web/release/web/public
          if-no-files-found: error
          retention-days: 7

  differential:
    name: Differential
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Build release binary
        run: cargo build --release

      - name: Differential lane
        env:
          FUTURUNA_STRESS_COUNT: 32
        run: ./scripts/differential.sh

  canary:
    name: Canary
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Build release binary
        run: cargo build --release

      - name: Canary lane
        run: ./scripts/canary.sh

  downstream:
    name: Downstream Consumers
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Build release binary
        run: cargo build --release

      - name: Downstream consumer lane
        run: ./scripts/downstream-canary.sh
