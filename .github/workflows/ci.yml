name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Mint gate
        run: ./scripts/mint.sh

      - name: From-rust transpiler validation
        run: ./target/release/runa from-rust --test examples/from-rust/

      - name: Format check
        run: ./target/release/runa fmt --check tests/

      - name: Version
        run: ./target/release/runa --version

  fmt:
    name: Rust formatting
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --check

  website:
    name: Website SSG
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust and WebAssembly target
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
          targets: wasm32-unknown-unknown

      - name: Cache website build tools
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            website/target/
          key: ${{ runner.os }}-website-dx-0.7.10-${{ hashFiles('Cargo.lock', 'website/Cargo.lock') }}

      - name: Install Dioxus CLI
        run: |
          if ! dx --version 2>/dev/null | grep -Fq 'dioxus 0.7.10 '; then
            cargo install dioxus-cli --version 0.7.10 --locked --force
          fi

      - name: Check website formatting
        run: cargo fmt --manifest-path website/Cargo.toml --check

      - name: Test canonical host redirect
        run: node --test website/cloudflare/www-redirect/worker.test.mjs

      - name: Build and verify static website
        run: ./website/scripts/build-ssg.sh

      - name: Upload generated website
        uses: actions/upload-artifact@v4
        with:
          name: futuruna-website
          path: website/target/dx/futuruna-web/release/web/public
          if-no-files-found: error
          retention-days: 7

  compatibility-guide:
    name: Compatibility guide
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Stable-surface compatibility prompt
        env:
          FUTURUNA_COMPAT_BASE: ${{ github.event.pull_request.base.sha }}
          FUTURUNA_COMPAT_HEAD: HEAD
        run: ./scripts/compatibility-guide-check.sh --base "$FUTURUNA_COMPAT_BASE" --head "$FUTURUNA_COMPAT_HEAD"

  differential:
    name: Differential
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Build release binary
        run: cargo build --release

      - name: Differential lane
        env:
          FUTURUNA_STRESS_COUNT: 32
        run: ./scripts/differential.sh

  canary:
    name: Canary
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Build release binary
        run: cargo build --release

      - name: Canary lane
        run: ./scripts/canary.sh

  downstream:
    name: Downstream Consumers
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Build release binary
        run: cargo build --release

      - name: Downstream consumer lane
        run: ./scripts/downstream-canary.sh
