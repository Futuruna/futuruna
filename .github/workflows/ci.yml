name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  repository-hygiene:
    name: Repository hygiene
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m unittest discover -s scripts/tests -p 'test_repository_hygiene.py'
      - run: python3 scripts/repository-hygiene.py

  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      # Preserve both platform results when one exposes an independent failure.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Install Z3 for solver verification
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y z3

      - name: Mint gate
        run: ./scripts/mint.sh

      - name: Tax-audit runtime and setup safeguards
        run: |
          RUNA_BIN="$PWD/target/release/runa" bash scripts/tax-audit-preflight.sh
          FUTURUNA_MODEL_TEST_RUNA="$PWD/target/release/runa" python3 -m unittest discover -s scripts/tests -p 'test_calculation_input_guide.py'
          ./target/release/runa tests/personskat_recurring_gifts_test.runa
          ./target/release/runa run tests/personskat_recurring_gifts_test.runa
          FUTURUNA_MODEL_TEST_RUNA="$PWD/target/release/runa" node --test tests/tax_audit_setup.test.mjs tests/pension_demo_input.test.mjs tests/tax_report_viewer.test.mjs tests/personskat_viewer.test.mjs tests/tax_municipality.test.mjs tests/green_check.test.mjs tests/personskat_green_check.test.mjs
          FUTURUNA_MODEL_TEST_RUNA="$PWD/target/release/runa" node --test tests/personskat_recurring_gifts.test.mjs
          ./target/release/runa tests/personskat_maintenance_recipient_test.runa
          FUTURUNA_MODEL_TEST_RUNA="$PWD/target/release/runa" node --test tests/personskat_maintenance_recipient.test.mjs
          ./target/release/runa tests/personskat_ferry_test.runa
          ./target/release/runa run tests/personskat_ferry_test.runa
          FUTURUNA_MODEL_TEST_RUNA="$PWD/target/release/runa" node --test tests/personskat_ferry.test.mjs
          FUTURUNA_MODEL_TEST_RUNA="$PWD/target/release/runa" node --test tests/tax_salary_metadata.test.mjs
          FUTURUNA_MODEL_TEST_RUNA="$PWD/target/release/runa" node --test tests/personskat_salary_input.test.mjs
          ./target/release/runa tests/personskat_partyear_input_controls_test.runa
          FUTURUNA_MODEL_TEST_RUNA="$PWD/target/release/runa" node --test --test-concurrency=1 tests/personskat_settlement_stage.test.mjs
          FUTURUNA_MODEL_TEST_RUNA="$PWD/target/release/runa" node --test --test-concurrency=1 tests/tax_credit_input.test.mjs tests/tax_credit_signs.test.mjs
          FUTURUNA_MODEL_TEST_RUNA="$PWD/target/release/runa" node --test tests/tax_supplementary_metadata.test.mjs
          FUTURUNA_MODEL_TEST_RUNA="$PWD/target/release/runa" node --test tests/tax_report_input_metadata.test.mjs
          FUTURUNA_MODEL_TEST_RUNA="$PWD/target/release/runa" node --test tests/tax_church_input.test.mjs
          FUTURUNA_MODEL_TEST_RUNA="$PWD/target/release/runa" node --test tests/tax_spouse_input.test.mjs
          FUTURUNA_MODEL_TEST_RUNA="$PWD/target/release/runa" node --test tests/tax_interest_input.test.mjs
          ./target/release/runa tests/personskat_bundskat_spouse_test.runa
          FUTURUNA_MODEL_TEST_RUNA="$PWD/target/release/runa" node --test tests/personskat_married_interest.test.mjs
          FUTURUNA_MODEL_TEST_RUNA="$PWD/target/release/runa" node --test tests/tax_source_input.test.mjs
          FUTURUNA_MODEL_TEST_RUNA="$PWD/target/release/runa" node --test tests/pension_couple_demo.test.mjs
          FUTURUNA_MODEL_TEST_RUNA="$PWD/target/release/runa" node --test tests/personskat_partyear_validity.test.mjs
          FUTURUNA_MODEL_TEST_RUNA="$PWD/target/release/runa" node --test tests/personskat_partyear_capital.test.mjs
          FUTURUNA_MODEL_TEST_RUNA="$PWD/target/release/runa" node --test tests/personskat_partyear_shares.test.mjs
          FUTURUNA_MODEL_TEST_RUNA="$PWD/target/release/runa" node --test tests/personskat_partyear_share_conversion.test.mjs
          ./target/release/runa tests/personskat_work_income_route_test.runa
          FUTURUNA_MODEL_TEST_RUNA="$PWD/target/release/runa" node --test tests/personskat_work_income_route.test.mjs
          FUTURUNA_MODEL_TEST_RUNA="$PWD/target/release/runa" node --test tests/personskat_property_route.test.mjs
          FUTURUNA_MODEL_TEST_RUNA="$PWD/target/release/runa" node --test tests/personskat_financial_route.test.mjs
          ./target/release/runa tests/personskat_honorar_expenses_test.runa
          FUTURUNA_MODEL_TEST_RUNA="$PWD/target/release/runa" node --test tests/personskat_honorar_expenses.test.mjs
          FUTURUNA_MODEL_TEST_RUNA="$PWD/target/release/runa" node --test tests/tax_employer_pension_conformance.test.mjs
          ./target/release/runa tests/personskat_pension_payment_year_test.runa
          FUTURUNA_MODEL_TEST_RUNA="$PWD/target/release/runa" node --test tests/personskat_pension_payment_year.test.mjs
          ./target/release/runa tests/personskat_pension_redeposit_test.runa
          FUTURUNA_MODEL_TEST_RUNA="$PWD/target/release/runa" node --test tests/personskat_pension_redeposit.test.mjs
          ./target/release/runa tests/personskat_pension_bank_year_test.runa
          FUTURUNA_MODEL_TEST_RUNA="$PWD/target/release/runa" node --test tests/personskat_pension_bank_year.test.mjs
          FUTURUNA_MODEL_TEST_RUNA="$PWD/target/release/runa" node --test tests/personskat_group_life.test.mjs
          ./target/release/runa tests/personskat_group_bonus_test.runa
          ./target/release/runa run tests/personskat_group_bonus_test.runa
          FUTURUNA_MODEL_TEST_RUNA="$PWD/target/release/runa" node --test tests/personskat_group_bonus.test.mjs
          ./target/release/runa tests/personskat_employee_expenses_test.runa
          ./target/release/runa run tests/personskat_employee_expenses_test.runa
          FUTURUNA_MODEL_TEST_RUNA="$PWD/target/release/runa" node --test tests/personskat_employee_expenses.test.mjs
          ./target/release/runa tests/personskat_boligjob_rules_test.runa
          ./target/release/runa run tests/personskat_boligjob_rules_test.runa
          FUTURUNA_MODEL_TEST_RUNA="$PWD/target/release/runa" node --test tests/boligjob_supplier_age.test.mjs
          ./target/release/runa tests/personskat_labour_hire_age_test.runa
          ./target/release/runa run tests/personskat_labour_hire_age_test.runa
          FUTURUNA_MODEL_TEST_RUNA="$PWD/target/release/runa" node --test tests/personskat_labour_hire_age.test.mjs
          FUTURUNA_MODEL_TEST_RUNA="$PWD/target/release/runa" node --test tests/personskat_dis_coverage.test.mjs

      - name: From-rust transpiler validation
        run: ./target/release/runa from-rust --test examples/from-rust/

      - name: Format check
        run: ./target/release/runa fmt --check tests/

      - name: Version
        run: ./target/release/runa --version

  fmt:
    name: Rust formatting
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --check

  website:
    name: Website SSG
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust and WebAssembly target
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
          targets: wasm32-unknown-unknown

      - name: Cache website build tools
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            website/target/
          key: ${{ runner.os }}-website-dx-0.7.10-${{ hashFiles('Cargo.lock', 'website/Cargo.lock') }}

      - name: Install Dioxus CLI
        run: |
          if ! dx --version 2>/dev/null | grep -Fq 'dioxus 0.7.10 '; then
            cargo install dioxus-cli --version 0.7.10 --locked --force
          fi

      - name: Check website formatting
        run: cargo fmt --manifest-path website/Cargo.toml --check

      - name: Test canonical host redirect
        run: node --test website/cloudflare/www-redirect/worker.test.mjs

      - name: Build and verify static website
        run: ./website/scripts/build-ssg.sh

      - name: Upload generated website
        uses: actions/upload-artifact@v4
        with:
          name: futuruna-website
          path: website/target/dx/futuruna-web/release/web/public
          if-no-files-found: error
          retention-days: 7

  compatibility-guide:
    name: Compatibility guide
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Stable-surface compatibility prompt
        env:
          FUTURUNA_COMPAT_BASE: ${{ github.event.pull_request.base.sha }}
          FUTURUNA_COMPAT_HEAD: HEAD
        run: ./scripts/compatibility-guide-check.sh --base "$FUTURUNA_COMPAT_BASE" --head "$FUTURUNA_COMPAT_HEAD"

  differential:
    name: Differential
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Build release binary
        run: cargo build --release

      - name: Differential lane
        env:
          FUTURUNA_STRESS_COUNT: 32
        run: ./scripts/differential.sh

  canary:
    name: Canary
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Build release binary
        run: cargo build --release

      - name: Canary lane
        run: ./scripts/canary.sh

  downstream:
    name: Downstream Consumers
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Build release binary
        run: cargo build --release

      - name: Downstream consumer lane
        run: ./scripts/downstream-canary.sh
