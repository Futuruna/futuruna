<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" role="img" aria-labelledby="title description">
  <title id="title">Futuruna</title>
  <desc id="description">The Futuruna logo beside the words A programming language for law.</desc>
  <defs>
    <radialGradient id="card-left" cx="0.18" cy="0.5" r="0.58">
