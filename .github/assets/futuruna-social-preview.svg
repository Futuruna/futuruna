    </radialGradient>
    <radialGradient id="logo-g3" cx="0.1" cy="0.55" r="0.6">
      <stop offset="0" stop-color="#5090e0" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#5090e0" stop-opacity="0"/>
    </radialGradient>
