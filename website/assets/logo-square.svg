<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <!-- Radial gradients for each rune color, positioned around the square -->
    <radialGradient id="g1" cx="0.15" cy="0.15" r="0.7">
      <stop offset="0%" stop-color="#e06070" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#e06070" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="g2" cx="0.85" cy="0.1" r="0.65">
      <stop offset="0%" stop-color="#50b060" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#50b060" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="g3" cx="0.1" cy="0.55" r="0.6">
      <stop offset="0%" stop-color="#5090e0" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#5090e0" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="g4" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#c060e0" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#c060e0" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="g5" cx="0.9" cy="0.5" r="0.6">
      <stop offset="0%" stop-color="#e0a040" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#e0a040" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="g6" cx="0.2" cy="0.9" r="0.65">
      <stop offset="0%" stop-color="#50c0c0" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#50c0c0" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="g7" cx="0.8" cy="0.85" r="0.6">
      <stop offset="0%" stop-color="#e08050" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#e08050" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Opaque canvas for share cards and installed-app icons. -->
  <rect width="512" height="512" fill="#0a0a0f"/>

  <!-- Dark base -->
  <rect width="512" height="512" rx="64" fill="#0a0a0f"/>

  <!-- Gradient mesh layers -->
  <rect width="512" height="512" rx="64" fill="url(#g1)"/>
  <rect width="512" height="512" rx="64" fill="url(#g2)"/>
  <rect width="512" height="512" rx="64" fill="url(#g3)"/>
  <rect width="512" height="512" rx="64" fill="url(#g4)"/>
  <rect width="512" height="512" rx="64" fill="url(#g5)"/>
  <rect width="512" height="512" rx="64" fill="url(#g6)"/>
  <rect width="512" height="512" rx="64" fill="url(#g7)"/>

  <!-- Fehu rune ᚠ in white, centered -->
  <g stroke="white" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round"
     transform="translate(270, 256) scale(5.5) translate(-32, -32)">
    <line x1="21" y1="58" x2="21" y2="6"/>
    <line x1="21" y1="28" x2="43" y2="6"/>
    <line x1="21" y1="43" x2="43" y2="21"/>
  </g>
</svg>
