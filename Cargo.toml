[package]
name = "futuruna"
version = "0.1.0"
edition = "2021"
description = "Futuruna — a three-dimensional programming language with seven runes"

[lib]
name = "futuruna"
path = "src/lib.rs"

[dependencies]
sha2 = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex = "1"
syn = { version = "2", features = ["full", "parsing", "visit"] }
quote = "1"
proc-macro2 = "1"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
calamine = "0.36"
rust_xlsxwriter = "0.96"
toml = "1.1"

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
zip = { version = "8.6", default-features = false, features = ["deflate"] }

[[bin]]
name = "runa"
path = "src/bin/runa.rs"

[[bin]]
name = "runa-adversarial"
path = "src/bin/runa_adversarial.rs"

[[bin]]
name = "runa-adversarial2"
path = "src/bin/runa_adversarial2.rs"
