[package]
name = "futuruna"
version = "0.1.1"
edition = "2021"
autobins = false
rust-version = "1.94"
description = "A programming language for law"
authors = ["Andreas Rudolph <research@futuruna.com>"]
license = "MIT"
repository = "https://github.com/Futuruna/futuruna"
homepage = "https://futuruna.com"
documentation = "https://futuruna.com/docs"
readme = "README.md"
keywords = ["programming-language", "computational-law", "rule-engine", "formal-rules", "legal-tech"]
categories = ["compilers", "command-line-utilities"]
default-run = "runa"
publish = ["crates-io"]
include = [
    "/src/**",
    "/docs/feature-stages.json",
    "/README.md",
    "/LICENSE",
]

[features]
default = []
internal-tools = []

[lib]
name = "futuruna"
path = "src/lib.rs"

[dependencies]
sha2 = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex = "1"
syn = { version = "2", features = ["full", "parsing", "visit"] }
quote = "1"
proc-macro2 = "1"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
calamine = "0.36"
rust_xlsxwriter = "0.96"
toml = "1.1"

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
zip = { version = "8.6", default-features = false, features = ["deflate"] }

# Calculation contracts can be large. Hashing them is compiler runtime work, so
# keep SHA-256 optimized without hiding Futuruna stack frames in dev/test builds.
[profile.dev.package.sha2]
opt-level = 3

[profile.test.package.sha2]
opt-level = 3

[profile.release]
strip = "symbols"

# Large Futuruna corpora spend far more time executing the compiler and
# interpreter than rebuilding dependencies. Keep ordinary dev/test builds fast
# to compile, while offering a persistent optimized binary for corpus work.
[profile.corpus]
inherits = "dev"

[profile.corpus.package.futuruna]
opt-level = 2

[[bin]]
name = "runa"
path = "src/bin/runa.rs"

[[bin]]
name = "runa-adversarial"
path = "src/bin/runa_adversarial.rs"
required-features = ["internal-tools"]

[[bin]]
name = "runa-adversarial2"
path = "src/bin/runa_adversarial2.rs"
required-features = ["internal-tools"]
